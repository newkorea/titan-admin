<%inherit file="admin_frame.html"/>

<%block name="css">
<style>
    /* 로그 모달 */
    .log-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); z-index: 9999; align-items: center; justify-content: center;
    }
    .log-modal-overlay.show { display: flex; }
    .log-modal {
        background: #fff; border-radius: 10px; width: 95%; max-width: 1200px;
        max-height: 90vh; display: flex; flex-direction: column;
        box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .log-modal-header {
        padding: 14px 20px; border-bottom: 1px solid #eee;
        font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: space-between;
    }
    .log-modal-header .close-btn {
        background: none; border: none; font-size: 22px; cursor: pointer; color: #888; padding: 0 6px;
    }
    .log-modal-header .close-btn:hover { color: #333; }
    .log-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .log-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .log-tbl th { background: #f8f9fa; padding: 8px 6px; text-align: left; border-bottom: 2px solid #dee2e6; font-weight: 700; white-space: nowrap; }
    .log-tbl td { padding: 6px; border-bottom: 1px solid #eee; white-space: nowrap; }
    .log-tbl tr:hover { background: #f5f7fa; }
    .log-tbl td.wrap { white-space: normal; word-break: break-all; max-width: 200px; }
    /* 만료 사용자 흐릿하게 */
    tr.row-expired td {
      background-color: #f5f5f5 !important;
      color: #bbb !important;
    }
    tr.row-expired td button {
      opacity: 0.4;
    }
    tr.row-expired:hover td {
      color: #888 !important;
      background-color: #efefef !important;
    }
    tr.row-expired:hover td button {
      opacity: 0.7;
    }
</style>
</%block>

<%block name="title">
	<div class="row">
    	<div class="form-group col-sm-2">
      		<label>회원 관리</label>
    	</div>
    	<div class="form-group col-sm-10">
      		<label id="active_users"></label>
      		<label class="ml-3" id="session_one_users"></label>
      		<label class="ml-3" id="session_two_users"></label>
      		<label class="ml-3" id="session_three_users"></label>
      		<label class="ml-3" id="session_four_users"></label>
      		<label class="ml-3" id="session_five_users"></label>
      		<label class="ml-3" id="session_six_users"></label>
      		<label class="ml-3" id="expired_users"></label>
      		<label class="ml-3" id="deleted_users"></label>
    	</div>
	</div>
</%block>
<%block name="subtitle">TITAN VPN에 가입한 회원들을 관리할 수 있습니다</%block>
<%block name="content">
  <!-- 검색필터 -->
  <div class="row">
    <div class="form-group col-sm-2">
      <label>번호[=]</label>
      <input class="form-control" id="filter_id">
    </div>
    <div class="form-group col-sm-2">
      <label>이메일[like]</label>
      <input class="form-control" id="filter_email">
    </div>
    <div class="form-group col-sm-2">
      <label>사용자명[like]</label>
      <input class="form-control" id="filter_name">
    </div>
    <div class="form-group col-sm-2">
      <label>아이피[like]</label>
      <input class="form-control" id="filter_ip">
    </div>
    <div class="form-group col-sm-2">
      <label>삭제여부</label>
      <select class="form-control" id="filter_delete" name="filter_delete">
        <option value="">선택하세요</option>
        % for delete in delete_list:
          <option value="${ delete.code }">${ delete.name }</option>
        % endfor
      </select>
    </div>
    <div class="form-group col-sm-2">
      <label>활성여부</label>
      <select class="form-control" id="filter_active" name="filter_active">
        <option value="">선택하세요</option>
        % for active in active_list:
          <option value="${ active.code }">${ active.name }</option>
        % endfor
      </select>
    </div>
    <div class="form-group col-sm-2">
      <label>권한</label>
      <select class="form-control" id="filter_staff" name="filter_staff">
        <option value="">선택하세요</option>
        % for staff in staff_list:
          <option value="${ staff.code }">${ staff.name }</option>
        % endfor
      </select>
    </div>
  </div>
  <!-- 버튼 -->
  <div class='btn-store'>
    <button class="btn btn-fw primary" onclick="reload_data()">
      <i class="fa fa-search mr5"></i>
      검색하기
    </button>
  </div>
  <!-- 데이터테이블즈 -->
  <div class="user-table">
    <table id="user-inform" class="table display">
      <thead>
        <tr>
          <th>번호</th>
          <th>이메일</th>
          <th>사용자명</th>
          <th>삭제여부</th>
          <th>활성여부</th>
          <th>차단여부</th>
          <th>권한</th>
          <th>가입아이피</th>
          <th>가입일시</th>
          <th>추가정보</th>
          <th>관리</th>
          <th>로그인</th>
          <th>접속실패</th>
          <th>강제종료</th>
          <th>접속로그</th>
          <th>분석</th>
          <th>탈퇴</th>
          <th>앱퇴출</th>          
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>

<!-- 로그 모달 -->
<div id="log-modal-overlay" class="log-modal-overlay" onclick="if(event.target===this)closeLogModal()">
    <div class="log-modal">
        <div class="log-modal-header">
            <span id="log-modal-title">로그</span>
            <button class="close-btn" onclick="closeLogModal()">&times;</button>
        </div>
        <div class="log-modal-body" id="log-modal-body">
            <div style="text-align:center;padding:40px;color:#888;"><i class="fa fa-spinner fa-spin"></i> 로딩 중...</div>
        </div>
    </div>
</div>
</%block>

<%block name="js">
<script>
// DataTables 저장된 정렬상태 제거 (이전 stateSave:true 잔여 데이터 클리어)
try { for (var k in localStorage) { if (k.indexOf('DataTables_user-inform') !== -1) localStorage.removeItem(k); } } catch(e){}
</script>
<script src="/static/admin/js/user.js?v=20260303diag1"></script>
</%block>
