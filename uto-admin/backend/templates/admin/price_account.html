<%inherit file="admin_frame.html"/>

<%block name="css">
</%block>

<%block name="title">계좌관리</%block>
<%block name="subtitle">사용자가 입금할 무통장 정보를 관리할 수 있습니다</%block>

<%block name="content">
<div>
  <!-- 무통장 정보 섹션 -->
  <div style="border-bottom: 2px solid #ddd; padding-bottom: 20px; margin-bottom: 30px;">
    <h3 style="margin-bottom: 20px; color: #333;">무통장 입금 정보</h3>
    
    <!-- 결제 방식 활성화 관리 (제목 바로 아래) -->
    <div style="background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
      <div style="margin-bottom: 15px; display: flex; align-items: center;">
        <input type="checkbox" id="wechat_payment_enabled" checked style="width: 20px; height: 20px; cursor: pointer; margin-right: 10px;">
        <label style="margin: 0; cursor: pointer; font-size: 16px; font-weight: bold;">
          위챗 페이 (WeChat Pay)
        </label>
      </div>
      <div style="margin-bottom: 20px; display: flex; align-items: center;">
        <input type="checkbox" id="alipay_payment_enabled" checked style="width: 20px; height: 20px; cursor: pointer; margin-right: 10px;">
        <label style="margin: 0; cursor: pointer; font-size: 16px; font-weight: bold;">
          알리페이 (Alipay)
        </label>
      </div>
      <button class="btn btn-fw primary" onclick='update_payment_methods()'>설정 저장</button>
    </div>

    <div class="form-group">
      <label>입금주</label>
      <input type="text" class="form-control" id="person_name" placeholder="타이탄VPN">
    </div>
    <div class="form-group">
      <label>은행 이름</label>
      <input type="text" class="form-control" id="bank_name" placeholder="신한은행">
    </div>
    <div class="form-group">
      <label>은행 계좌번호</label>
      <input type="text" class="form-control" id="bank_number" placeholder="123-12515-1623">
    </div>
    <button class="btn btn-fw warn" onclick='update_bank()'>수정</button>
  </div>
</div>
</%block>

<%block name="js">
<script src="/static/admin/js/account.js"></script>
</%block>
