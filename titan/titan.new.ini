[uwsgi]
vhost = true
chmod-socket = 666
; chown-socket requires running as root; fallback to permissive mode
chmod-socket = 666
socket = /tmp/titan.sock
master = true
enable-threads = true
processes = 2
venv = /home/newkorea/project/titan/.venv310
wsgi-file = /home/newkorea/project/titan/main/wsgi.py
chdir = /home/newkorea/project/titan
touch-reload = /home/newkorea/project/titan/main/reload
pidfile = /tmp/titan.pid
vacuum = true
die-on-term = true
harakiri = 120
harakiri-verbose = true
; managed by systemd: do not daemonize
; daemonize = /home/newkorea/project/titan/logs/uwsgi.log
log-date = true
disable-logging = false
