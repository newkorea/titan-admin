% if 'id' in request.session:
<%inherit file="base.html"/>
<%block name="title">${_('Change password')}</%block>
<%block name="content">
<!--testimonial section start-->
<section class="testimonial-section ptb-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="testimonial-quote-wrap" id="changePasswordForm">
                    <div class="testimonial-quote">
                        <div class="row">
                            <div class="col-md-12">
                                <h4>${_('Change password')}</h4>
                                <hr>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <form id="passwordChangeForm">
                                    <input type="hidden" name="csrfmiddlewaretoken" value="${csrf_token}">
                                    <div class="form-group">
                                        <label for="old_password">${_('Current Password')}</label>
                                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="new_password1">${_('New Password')}</label>
                                        <input type="password" class="form-control" id="new_password1" name="new_password1" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="new_password2">${_('Confirm New Password')}</label>
                                        <input type="password" class="form-control" id="new_password2" name="new_password2" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">${_('Change password')}</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!--testimonial section end-->
<script>
    $('#passwordChangeForm').on('submit', function(e) {
        e.preventDefault();
        $.ajax({
            url: '/mypage/change_password_action',
            type: 'POST',
            data: $(this).serialize(),
            success: function(data) {
                if (data.result == '200') {
                    swal.fire(
                        "${_('Success!')}",
                        data.text,
                        'success'
                    ).then(function() {
                        location.href = '/mypage';
                    });
                } else {
                    swal.fire(
                        "${_('Error!')}",
                        data.text,
                        'error'
                    );
                }
            }
        });
    });
</script>
</%block>
% else:
<script>
    location.href = "/login";
</script>
% endif
