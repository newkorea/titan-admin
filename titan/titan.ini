[uwsgi]
vhost = true
chmod-socket = 666
socket = /tmp/titan.sock
master = true
enable-threads = true
processes = 2
venv = /home/ubuntu/project/titan/venv
wsgi-file = /home/ubuntu/project/titan/main/wsgi.py
chdir = /home/ubuntu/project/titan
touch-reload = /home/ubuntu/project/titan/main/reload
daemonize = /home/ubuntu/uwsgi/titan.log