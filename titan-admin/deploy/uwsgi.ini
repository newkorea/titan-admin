[uwsgi]
chdir = /home/newkorea/project/titan-admin
module = main.wsgi:application
home = /home/newkorea/project/titan-admin/.venv38

master = true
processes = 4
threads = 2

socket = /tmp/titan-admin.sock
# Relax permissions so nginx (www-data) can access without group ownership tweaks.
chmod-socket = 666
pidfile = /tmp/titan-admin.pid
vacuum = true
die-on-term = true
harakiri = 120
harakiri-verbose = true
max-requests = 2000
buffer-size = 65535
stats = /tmp/titan-admin-stats.sock
lazy-apps = true
enable-threads = true
thunder-lock = true

# Allow touch-reload for zero-downtime reloads
touch-reload = /home/newkorea/project/titan-admin/main/reload

logger = file:/home/newkorea/project/titan-admin/logs/uwsgi.log
